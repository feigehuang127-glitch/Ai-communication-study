version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: platform_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    # MySQL health check with root credentials required for MySQL 8.0+ when root password is set
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: platform-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: platform-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/platform_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      SPRING_REDIS_HOST: redis
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    container_name: platform-ai
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # ═══════════════════════════════════════════════════════════════
    # WARNING: Mounting docker.sock grants the AI service full control
    # over the host Docker daemon. A malicious code execution payload
    # can escape the sandbox container and compromise the HOST machine,
    # including MySQL, Redis, and backend containers.
    #
    # PRODUCTION: Remove this volume mount and use one of:
    #   - gVisor (runsc): docker run --runtime=runsc ...
    #   - Firecracker:   via Weave Ignite or firecracker-containerd
    #   - Sysbox:        via Nestybox sysbox-runc
    #   - KVM-based VM:  QEMU micro-VM per sandbox session
    #
    # DEV ONLY: Uncomment the following line for local sandbox testing.
    # ═══════════════════════════════════════════════════════════════
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build: ./frontend
    container_name: platform-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_WS_URL: ws://localhost:8080
    depends_on:
      - backend

volumes:
  mysql_data:
